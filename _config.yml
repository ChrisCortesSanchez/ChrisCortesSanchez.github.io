# GitHub Pages builds this site with Jekyll. index.html, styles.css and script.js
# are served as-is; only the blog (blog/, _posts/, _layouts/) is generated.
title: Christopher Cortes-Sanchez
description: Project writeups and CTF walkthroughs by Christopher Cortes-Sanchez.
url: https://chriscortessanchez.com

permalink: /blog/:title/
markdown: kramdown
highlighter: rouge

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
